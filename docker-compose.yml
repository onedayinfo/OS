name: os

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-os}
      POSTGRES_DB: ${POSTGRES_DB:-os}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-os} -d ${POSTGRES_DB:-os}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - os-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Sobrescreve o host do .env (localhost) pelo nome do serviço na rede compose,
      # usando as mesmas credenciais do serviço postgres.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-os}:${POSTGRES_PASSWORD:-os}@postgres:5432/${POSTGRES_DB:-os}?schema=public"
    volumes:
      - uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - os-net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - os-net

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - os-net

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution_redis:/data
    networks:
      - os-net

  # Conector do WhatsApp (API NAO oficial, somente leitura no nosso uso).
  # O backend fala com ela em http://evolution-api:8080 pela rede interna.
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution}@evolution-db:5432/evolution?schema=evolution_api"
      DATABASE_CONNECTION_CLIENT_NAME: os
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Nao guardamos mensagens na Evolution: o OS e o dono do historico.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # Webhook por instancia (via API, ver deploy/README.md); sem webhook global.
      WEBHOOK_GLOBAL_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - os-net

volumes:
  pg_data:
  uploads:
  evolution_db:
  evolution_redis:
  evolution_instances:

networks:
  os-net:
