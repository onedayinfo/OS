name: os

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-os}
      POSTGRES_DB: ${POSTGRES_DB:-os}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-os} -d ${POSTGRES_DB:-os}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - os-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Sobrescreve o host do .env (localhost) pelo nome do serviço na rede compose,
      # usando as mesmas credenciais do serviço postgres.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-os}:${POSTGRES_PASSWORD:-os}@postgres:5432/${POSTGRES_DB:-os}?schema=public"
    volumes:
      - uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - os-net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - os-net

volumes:
  pg_data:
  uploads:

networks:
  os-net:
