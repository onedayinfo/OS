# Stack do Sistema de OS para Portainer.
#
# Puxa as imagens já publicadas no Docker Hub (não builda nada aqui).
# TODA configuração específica de cliente/domínio vem de variáveis de ambiente
# (aba "Environment variables" do stack no Portainer, ou um stack.env) — a mesma
# imagem serve qualquer instalação. Veja deploy/stack.env.example.
#
# Topologia assumida: front e API no MESMO domínio, com um proxy reverso
# (Traefik, Nginx Proxy Manager, etc.) roteando:
#   https://<SEU_DOMINIO>/api   -> 127.0.0.1:${BACKEND_PORT}
#   https://<SEU_DOMINIO>/      -> 127.0.0.1:${FRONTEND_PORT}

name: os

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - os-net

  backend:
    image: onedayinformatica/os-backend:${OS_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      PORT: "3001"
      # Domínio público do sistema (mesmo valor nos dois). Usado em CORS e nos
      # links de convite / recuperação de senha e dos e-mails.
      APP_URL: ${APP_URL}
      PORTAL_URL: ${PORTAL_URL}
      # Cookie do refresh. Mesmo domínio + HTTPS: lax / true.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_INBOUND_SECRET: ${RESEND_INBOUND_SECRET:-}
      MAIL_FROM: ${MAIL_FROM}
      STORAGE_PATH: /app/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    networks:
      - os-net

  frontend:
    image: onedayinformatica/os-frontend:${OS_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    # A imagem chama /api relativo (mesmo domínio). Para domínios separados,
    # gere uma imagem com --build-arg NEXT_PUBLIC_API_URL=https://api.../api.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - os-net

volumes:
  pg_data:
  uploads:

networks:
  os-net:
