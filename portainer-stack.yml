# Stack do Sistema de OS para Portainer.
#
# Puxa as imagens já publicadas no Docker Hub (não builda nada aqui).
# TODA configuração de cliente/domínio vem de variáveis de ambiente — a mesma
# imagem serve qualquer instalação. Veja deploy/stack.env.example.
#
# Publicação via Cloudflare Tunnel: nenhuma porta é exposta no host. O Next
# encaminha /api/* para o backend na rede interna (BACKEND_INTERNAL_URL), então
# front e API ficam na mesma origem. No painel Zero Trust do Cloudflare o
# túnel roteia  <SEU_DOMINIO>  ->  http://frontend:3000  (um hostname só).

name: os

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - os-net

  backend:
    image: onedayinformatica/os-backend:${OS_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      PORT: "3001"
      # Domínio público do sistema (mesmo valor nos dois). Usado em CORS e nos
      # links de convite / recuperação de senha e dos e-mails.
      APP_URL: ${APP_URL}
      PORTAL_URL: ${PORTAL_URL}
      # Cookie do refresh. Mesma origem + HTTPS: lax / true.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Criptografa os segredos configurados em /app/config (Resend, S3).
      # Gere com: openssl rand -base64 32. Sem ela o sistema sobe, mas a UI de
      # Configurações não salva segredos (usa só o fallback das vars abaixo).
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # Fallback legado — o recomendado é configurar em /app/config.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_INBOUND_SECRET: ${RESEND_INBOUND_SECRET:-}
      MAIL_FROM: ${MAIL_FROM}
      STORAGE_PATH: /app/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    networks:
      - os-net

  frontend:
    image: onedayinformatica/os-frontend:${OS_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # O servidor Next encaminha /api/* para cá (rede interna).
      BACKEND_INTERNAL_URL: http://backend:3001
    networks:
      - os-net

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - os-net

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution_redis:/data
    networks:
      - os-net

  # Conector do WhatsApp (API NAO oficial, somente leitura no nosso uso).
  # O backend fala com ela em http://evolution-api:8080 pela rede interna.
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=evolution_api"
      DATABASE_CONNECTION_CLIENT_NAME: os
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Nao guardamos mensagens na Evolution: o OS e o dono do historico.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # Webhook por instancia (via API, ver deploy/README.md); sem webhook global.
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - os-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - os-net

volumes:
  pg_data:
  uploads:
  evolution_db:
  evolution_redis:
  evolution_instances:

networks:
  os-net:
